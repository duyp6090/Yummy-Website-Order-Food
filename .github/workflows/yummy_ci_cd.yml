# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: CI/CD Pipeline

on:
  push:
    branches: [ "staging" ]
  pull_request:
    branches: [ "staging", "product" ]

jobs:
    
  Analysis:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Pull source code to scan
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # fetch all commit of all branch

      - name: Analyze with SonarQube
        # You can pin the exact commit or the version.
        # uses: SonarSource/sonarqube-scan-action@v1.1.0
        uses: SonarSource/sonarqube-scan-action@7295e71c9583053f5bf40e9d4068a0c974603ec8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}   # Generate a token on SonarQube, add it to the secrets of this repo with the name SONAR_TOKEN (Settings > Secrets > Actions > add new repository secret)
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}   # add the URL of your instance to the secrets of this repo with the name SONAR_HOST_URL (Settings > Secrets > Actions > add new repository secret)

  Build:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest

    steps:
      - name: Pull source code to build
        uses: actions/checkout@v4

      # Login to github package registry
      - name: Login to github package registry
        uses: docker/login-action@v3
        with: 
          registry: |
            ghcr.io
          username: ${{ github.actor}}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Create extract Metadata
      - name: Create extract Metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest

      # Create cache build
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # Build and Push To Ghcr
      - name: Build and Push to Ghcr
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags}}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha, mode=max

  Deploy-Staging:
    runs-on: ubuntu-latest
    needs: Build

    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/staging' }}
    steps: 

      - name: Copy .env and docker-compose-staging.yml to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USERNAME }}
          key: ${{ secrets.STAGING_KEY }}
          source: |
            .env
            docker-compose-staging.yml
          target: ~/yummy  

      - name: Deploy to staging
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USERNAME }}
          key: ${{ secrets.STAGING_KEY }}
          script: |
            echo "Deploying to staging server..."

            docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}

            docker pull ghcr.io/${{ github.repository }}:latest

            cd yummy

            docker-compose -f docker-compose-staging.yml up -d  --remove-orphans --force-recreate

            docker image prune -f

            echo "Deployment to staging server completed."
